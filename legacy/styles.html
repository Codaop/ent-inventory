<style>
  :root {
    --primary:        #134679;
    --primary-hover:  #1a5da0;
    --primary-light:  #e8f1fc;
    --sidebar-width:  240px;
    --topbar-height:  56px;
  }

  /* ── Reset / Base ──────────────────────────────── */
  body {
    background: #f0f4f8;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: .9rem;
  }

  /* ── Top Navbar ─────────────────────────────────── */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar-height);
    background: var(--primary);
    display: flex;
    align-items: center;
    padding: 0 16px;
    z-index: 1040;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .topbar-brand {
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: .3px;
    flex: 1;
  }
  .topbar-user { color: rgba(255,255,255,.9); font-size: .82rem; }
  .badge-role {
    background: rgba(255,255,255,.2);
    color: #fff;
    font-size: .7rem;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: .5px;
  }

  /* ── Sidebar ────────────────────────────────────── */
  .sidebar {
    position: fixed;
    top: var(--topbar-height);
    left: 0;
    bottom: 0;
    width: var(--sidebar-width);
    background: #fff;
    border-right: 1px solid #e2e8f0;
    overflow-y: auto;
    z-index: 1030;
    transition: transform .25s ease;
  }
  .sidebar-section {
    padding: 12px 8px 4px;
    font-size: .7rem;
    font-weight: 700;
    color: #94a3b8;
    letter-spacing: .8px;
    text-transform: uppercase;
  }
  .nav-link-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    border-radius: 8px;
    margin: 1px 8px;
    color: #475569;
    cursor: pointer;
    font-size: .875rem;
    transition: background .15s, color .15s;
    text-decoration: none;
  }
  .nav-link-item:hover { background: var(--primary-light); color: var(--primary); }
  .nav-link-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
  .nav-link-item .bi { font-size: 1rem; }

  /* ── Main Content ───────────────────────────────── */
  .main-content {
    margin-left: var(--sidebar-width);
    margin-top: var(--topbar-height);
    padding: 24px;
    min-height: calc(100vh - var(--topbar-height));
  }
  .page { display: none; }
  .page.active { display: block; }

  /* ── KPI Cards ──────────────────────────────────── */
  .kpi-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .kpi-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: var(--primary-light);
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    flex-shrink: 0;
  }
  .kpi-value { font-size: 1.6rem; font-weight: 700; color: #1e293b; line-height: 1; }
  .kpi-label { font-size: .75rem; color: #64748b; margin-top: 2px; }

  /* ── Cards ──────────────────────────────────────── */
  .card {
    border: none;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .card-header {
    background: #fff;
    border-bottom: 1px solid #f1f5f9;
    font-weight: 600;
    color: #1e293b;
    border-radius: 12px 12px 0 0 !important;
    padding: 14px 20px;
  }

  /* ── Tables ─────────────────────────────────────── */
  .table thead th {
    background: #f8fafc;
    color: #64748b;
    font-weight: 600;
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .5px;
    border-bottom: 1px solid #e2e8f0;
  }
  .table td { vertical-align: middle; color: #334155; font-size: .875rem; }
  .table-hover tbody tr:hover { background: var(--primary-light); }

  /* ── Buttons ────────────────────────────────────── */
  .btn-primary { background: var(--primary); border-color: var(--primary); }
  .btn-primary:hover, .btn-primary:focus { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-outline-primary { color: var(--primary); border-color: var(--primary); }
  .btn-outline-primary:hover { background: var(--primary); border-color: var(--primary); }

  /* ── Badges ─────────────────────────────────────── */
  .badge-pending  { background: #fff3cd; color: #856404; }
  .badge-approved { background: #d1e7dd; color: #155724; }
  .badge-rejected { background: #f8d7da; color: #842029; }
  .badge-returned { background: #e2e8f0; color: #475569; }
  .badge-overdue  { background: #f8d7da; color: #842029; }
  .badge-completed{ background: #d1e7dd; color: #155724; }
  .status-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 600;
    display: inline-block;
  }

  /* ── Toast ──────────────────────────────────────── */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; }
  .toast { min-width: 280px; border-radius: 10px; border: none; box-shadow: 0 4px 16px rgba(0,0,0,.12); }

  /* ── Loading overlay ────────────────────────────── */
  #loading-overlay {
    position: fixed; inset: 0;
    background: rgba(255,255,255,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 9998;
    backdrop-filter: blur(2px);
  }
  .spinner-ring {
    width: 44px; height: 44px;
    border: 4px solid #e2e8f0;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Search bar ─────────────────────────────────── */
  .search-box {
    position: relative; max-width: 280px;
  }
  .search-box input { padding-left: 36px; border-radius: 8px; border: 1px solid #e2e8f0; }
  .search-box .bi-search {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%); color: #94a3b8; font-size: .9rem;
  }

  /* ── Low-stock badge in qty cell ─────────────────── */
  .low-stock { color: #dc3545; font-weight: 600; }

  /* ── Mobile ─────────────────────────────────────── */
  @media (max-width: 767px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.15); }
    .main-content { margin-left: 0; padding: 16px; }
    .sidebar-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.35); z-index: 1025;
    }
    .sidebar-backdrop.show { display: block; }
    .kpi-value { font-size: 1.3rem; }
  }
</style>
